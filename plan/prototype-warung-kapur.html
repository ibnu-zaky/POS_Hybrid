<!DOCTYPE html>
<html lang="id" data-theme="dark" data-photo="bw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warung Kapur, prototype sistem kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --board:#222222;--chalk:#f4f4f4;--dim:#a8a8a8;--faint:rgba(255,255,255,.18);--frame:#3a3a3a;
    --glow:rgba(255,255,255,.2);--smudge:rgba(255,255,255,.055);--overlay:rgba(0,0,0,.62);
    --r1:16px 5px 18px 7px / 7px 16px 5px 18px;
    --r2:6px 18px 8px 16px / 16px 6px 18px 8px;
    --r3:12px 8px 20px 5px / 8px 18px 6px 14px;
  }
  :root[data-theme="light"]{
    --board:#f5f5f5;--chalk:#1c1c1c;--dim:#666666;--faint:rgba(0,0,0,.18);--frame:#c8c8c8;
    --glow:transparent;--smudge:rgba(0,0,0,.04);--overlay:rgba(0,0,0,.35);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;height:100%;background:var(--board);color:var(--chalk);font-family:'Patrick Hand','Chalkboard SE','Comic Sans MS',cursive;font-size:18px;line-height:1.35}
  #root{height:100%}
  [hidden]{display:none !important}
  button,select,input,textarea{font:inherit;color:inherit}
  h1,h2,h3,p,ul,ol{margin:0}
  ul,ol{padding:0;list-style:none}
  table{border-collapse:collapse;width:100%}

  body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:80}
  body::before{background:radial-gradient(60% 40% at 25% 20%,var(--smudge),transparent 70%),radial-gradient(50% 35% at 82% 78%,var(--smudge),transparent 70%),radial-gradient(40% 25% at 55% 55%,var(--smudge),transparent 70%)}
  body::after{opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  .box{position:relative;isolation:isolate}
  .box::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border:2.5px solid var(--chalk);border-radius:var(--r1);filter:url(#rough)}
  .box.r2::before{border-radius:var(--r2)}
  .box.r3::before{border-radius:var(--r3)}
  .dim{color:var(--dim)}
  .sp{flex:1}
  .ic{width:26px;height:26px;flex:none}

  /* tombol */
  .btn{position:relative;isolation:isolate;background:transparent;border:0;cursor:pointer;padding:8px 16px;min-height:44px;text-shadow:0 0 6px var(--glow);transition:transform .12s}
  .btn:hover:not(:disabled){transform:rotate(-.7deg)}
  .btn:active:not(:disabled){transform:scale(.96)}
  .btn:disabled{opacity:.38;cursor:not-allowed}
  .btn.on,.btn.fill{color:var(--board);text-shadow:none}
  .btn.on::before,.btn.fill::before{background:var(--chalk)}
  .btn.fill{font-family:'Caveat Brush','Patrick Hand',cursive;font-size:1.5rem;letter-spacing:.02em}
  .btn.small{min-height:40px;padding:4px 14px}
  .link{background:none;border:0;cursor:pointer;color:var(--dim);text-decoration:underline;text-decoration-style:dashed;text-underline-offset:4px;padding:6px 2px;min-height:40px}
  .link:hover{color:var(--chalk)}
  :focus-visible{outline:2px dashed var(--chalk);outline-offset:4px}

  /* bingkai papan: kasir garis tunggal, admin garis ganda, pelanggan tipis */
  .frame{height:100%;border:12px solid var(--frame);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 8px 28px rgba(0,0,0,.4)}
  :root[data-theme="light"] .frame{box-shadow:inset 0 0 0 2px rgba(0,0,0,.12),inset 0 6px 20px rgba(0,0,0,.12)}
  .frame.admin{border-style:double;border-width:14px}
  .frame.cust{border-width:6px}

  .shell{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr)}
  .shell.col{grid-template-columns:76px minmax(0,1fr)}
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .page{flex:1;min-height:0;display:flex;flex-direction:column}

  /* sidebar */
  .side{display:flex;flex-direction:column;gap:10px;padding:14px 10px 12px;border-right:2px dashed var(--faint);min-height:0;min-width:0}
  .sbrand{display:flex;align-items:center;gap:10px;padding:0 4px 8px;border-bottom:2px dashed var(--faint)}
  .sbrand svg{width:34px;height:34px;flex:none}
  .sbrand b{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:1.5rem;line-height:1;text-decoration:underline wavy;text-decoration-thickness:2px;text-underline-offset:6px}
  .snav{display:flex;flex-direction:column;gap:4px}
  .sscroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .stitle{color:var(--dim);font-size:.95rem;padding:10px 6px 2px}
  .navi{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;background:transparent;cursor:pointer;text-align:left;border-radius:var(--r2);position:relative}
  .navi:hover{outline:2px dashed var(--faint);outline-offset:-2px}
  .navi.on{background:var(--chalk);color:var(--board);text-shadow:none}
  .navi .lbl{flex:1;line-height:1.1}
  .navi .cnt{color:var(--dim);font-size:.95rem}
  .navi.on .cnt{color:var(--board)}
  .navi .ic{width:24px;height:24px}
  .bdg{min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--chalk);color:var(--board);display:grid;place-items:center;font-family:'Caveat Brush','Patrick Hand',cursive;font-size:1.05rem}
  .navi.on .bdg{background:var(--board);color:var(--chalk)}
  .bdg.pop{animation:pop .22s ease-out}
  .ts{display:flex;align-items:center;gap:8px;padding:2px 2px 2px 4px}
  .ts .photo{width:44px;flex:none;margin:0;border-radius:6px}
  .ts .photo.none small{display:none}
  .ts .photo.none svg{width:22px;height:22px}
  .tsn{flex:1;line-height:1.1;font-size:.98rem}
  .rbtn{width:34px;height:34px;border-radius:50%;border:2px solid var(--chalk);background:transparent;cursor:pointer;font-size:1.2rem;line-height:1;display:grid;place-items:center;padding:0;flex:none}
  .rbtn:hover{background:var(--chalk);color:var(--board)}
  .sfoot{display:flex;flex-direction:column;gap:4px;border-top:2px dashed var(--faint);padding-top:8px}
  .who{color:var(--dim);padding:0 6px 4px}
  .shell.col .lbl,.shell.col .hidecol,.shell.col .cnt,.shell.col .who{display:none}
  .shell.col .navi{justify-content:center;padding:6px 0}
  .shell.col .sbrand{justify-content:center}
  .shell.col .bdg{position:absolute;top:2px;right:2px;min-width:20px;height:20px;font-size:.9rem;padding:0 4px}
  .backdrop{position:fixed;inset:0;background:var(--overlay);z-index:34}

  /* header halaman */
  .hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:2px dashed var(--faint)}
  .ptitle{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:2.1rem;line-height:1;filter:url(#grain);text-shadow:0 0 8px var(--glow)}
  .clock{color:var(--dim)}
  .stamp{display:inline-block;padding:4px 16px;font-family:'Caveat Brush','Patrick Hand',cursive;font-size:1.3rem;line-height:1.2}
  .stamp.dbl::before{border-style:double;border-width:5px}
  .hstat{padding:4px 14px;line-height:1.1}
  .hstat span{color:var(--dim);font-size:.9rem;display:block}
  .hstat b{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:1.3rem}
  .hamb{display:none}

  /* kasir */
  .kasir{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;padding:14px 20px 16px}
  .menu{display:flex;flex-direction:column;min-height:0;gap:12px}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .search{display:flex;align-items:center;gap:8px;padding:0 14px;flex:1 1 200px;max-width:340px;min-height:44px}
  .search .ic{width:22px;height:22px;opacity:.8}
  .search input{background:transparent;border:0;outline:0;width:100%;padding:8px 0}
  .search input::placeholder{color:var(--dim)}
  .mchips{display:none;gap:8px;flex-wrap:wrap}
  .edit-hint{padding:8px 14px;color:var(--dim)}
  .grid{flex:1;overflow:auto;padding:12px 8px 24px;display:grid;align-content:start;gap:18px;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .card{text-align:left;background:transparent;border:0;cursor:pointer;padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;transition:transform .12s}
  .card:nth-child(3n+2)::before{border-radius:var(--r2)}
  .card:nth-child(3n)::before{border-radius:var(--r3)}
  .card:hover:not(:disabled){transform:rotate(-.7deg) translateY(-2px)}
  .card:active:not(:disabled){transform:scale(.97)}
  .card .nm{font-size:1.2rem;line-height:1.12;padding:0 4px;text-shadow:0 0 6px var(--glow)}
  .card .pr{color:var(--dim);padding:0 4px;margin-top:auto}
  .card:disabled{cursor:not-allowed;opacity:.5}
  .card:disabled .nm{text-decoration:line-through;text-decoration-style:wavy}
  .card:disabled::before{border-style:dashed}
  .qty{position:absolute;top:-10px;right:-8px;min-width:30px;height:30px;padding:0 6px;border-radius:50%;background:var(--chalk);color:var(--board);display:grid;place-items:center;font-family:'Caveat Brush','Patrick Hand',cursive;font-size:1.2rem;transform:rotate(8deg);z-index:2}
  .qty.pop{animation:pop .18s ease-out}
  .qty.edit-badge{border-radius:14px;font-size:1rem;padding:0 10px;transform:rotate(4deg);min-width:0;white-space:nowrap}
  @keyframes pop{from{transform:scale(.5) rotate(8deg)}to{transform:scale(1) rotate(8deg)}}
  .empty-menu{grid-column:1/-1;color:var(--dim);padding:30px 0;text-align:center}

  .photo{position:relative;isolation:isolate;width:100%;aspect-ratio:4/3;overflow:hidden;display:block;border-radius:var(--r2);margin-bottom:6px}
  .photo::after{content:"";position:absolute;inset:0;border:2.5px solid var(--chalk);border-radius:inherit;filter:url(#rough);pointer-events:none}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.1) brightness(.92)}
  :root[data-photo="color"] .photo img{filter:none}
  .photo.none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim)}
  .photo.none .ic{width:40px;height:40px;opacity:.7}
  .photo.none small{font-size:.9rem}
  .card:nth-child(3n+2) .photo{border-radius:var(--r3)}

  .ticket{padding:16px 16px 14px;display:flex;flex-direction:column;min-height:0;gap:10px}
  .t-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .t-head h2{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:1.9rem;line-height:1}
  .close-drawer{display:none}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tablerow{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--dim)}
  .tablerow select{background:var(--board);border:0;padding:6px 8px;min-height:40px;cursor:pointer;color:var(--chalk)}
  .tablerow .sel{padding:0 6px}
  .items{flex:1;min-height:90px;overflow:auto;padding:0 4px;margin:0 -4px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1.5px dashed var(--faint);align-items:center}
  .line .each{color:var(--dim);font-size:.92rem}
  .line .sub{text-align:right}
  .step{display:flex;align-items:center;gap:8px}
  .step button{width:34px;height:34px;border-radius:50%;border:2px solid var(--chalk);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:1.25rem;line-height:1;padding:0}
  .step button:hover{background:var(--chalk);color:var(--board)}
  .step output{min-width:22px;text-align:center}
  .empty{color:var(--dim);text-align:center;padding:22px 10px}
  .empty .ic{width:64px;height:64px;opacity:.5;display:block;margin:0 auto 8px}
  .sum{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;justify-content:space-between;color:var(--dim)}
  .disc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--dim)}
  .disc .btn{padding:2px 12px;min-height:34px}
  .total{display:flex;justify-content:space-between;align-items:baseline;border-top:4px double var(--chalk);padding-top:8px;margin-top:4px;font-family:'Caveat Brush','Patrick Hand',cursive;font-size:2.5rem;line-height:1.1}
  .total span:last-child{filter:url(#grain);text-shadow:0 0 8px var(--glow)}
  .sum .btn.fill{width:100%;min-height:54px;margin-top:6px}
  .mbar{display:none}

  /* halaman berisi daftar */
  .content{flex:1;min-height:0;overflow:auto;padding:18px 24px 40px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
  .inner{max-width:1100px;margin:0 auto}
  .pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .pagehead h2,.sectitle{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:1.8rem;line-height:1}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .chip{display:inline-block;padding:2px 12px;border:2px solid var(--chalk);border-radius:var(--r2);font-size:.95rem;white-space:nowrap;line-height:1.35}
  .s-diterima,.p-lunas{border-style:double;border-width:4px;padding:0 10px}
  .s-diproses,.p-belum{border-style:dashed}
  .s-siap{background:var(--chalk);color:var(--board)}
  .s-selesai{text-decoration:line-through}
  .s-ditolak{border-style:dashed;text-decoration:line-through}
  .olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .ocard{padding:16px;display:flex;flex-direction:column;gap:10px}
  .ocard header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ocard header b{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:1.6rem;line-height:1}
  .ocard .tags{display:flex;gap:8px;flex-wrap:wrap}
  .ocard li{padding:2px 0}
  .note{display:block;color:var(--dim);font-size:.92rem}
  .ofoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--faint);padding-top:10px;margin-top:auto}
  .ofoot .tot{font-family:'Caveat Brush','Patrick Hand',cursive;font-size:1.5rem}
  .oact{display:flex;gap:8px;flex-wrap:wrap}
  .oact .btn{min-height:40px;padding:4px 14px}
  .why{color:var(--dim)}

  .tw{overflow-x:auto}
  .tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1.5px dashed var(--faint);vertical-align:middle}
  .tbl th{color:var(--dim);font-weight:400;border-bottom:2px solid var(--chalk)}
  .tbl td.r,.tbl th.r{text-align:right}
  .tbl .th{width:72px;margin:0}
  .tbl .th.none small{display:none}
  .tbl .th.none .ic{width:24px;height:24px}
  .tbl .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:22px}
  .stat{padding:14px 16px}
  .stat span{color:var(--dim)}
  .stat b{display:block;font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:2rem;line-height:1.1;filter:url(#grain)}
  .two{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .twocol{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
  .panel{padding:16px}
  .panel .sectitle{margin-bottom:10px}
  .chart{width:100%;height:auto;display:block}
  .chart text{fill:currentColor;font-family:'Patrick Hand',cursive;font-size:15px}
  .chart text.dim{fill:var(--dim)}
  .rank li{display:flex;gap:10px;padding:7px 0;border-bottom:1.5px dashed var(--faint);align-items:baseline}
  .rank li span:first-child{width:22px;color:var(--dim)}
  .rank li span:nth-child(2){flex:1}
  .catrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1.5px dashed var(--faint)}
  .catrow .nm{flex:1;min-width:140px;display:flex;align-items:center;gap:10px}
  .addrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .addrow .fld{flex:1 1 220px;max-width:340px}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
  .tcard{padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
  .tcard h3{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:1.7rem;line-height:1}
  .tcard .qrbox{width:170px;padding:10px;margin:4px 0}
  .tcard .url{color:var(--dim);font-size:.85rem;word-break:break-all}
  .tcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .qr{display:block;width:100%;height:auto}
  .fld{display:block}
  .field{display:flex;flex-direction:column;gap:4px;color:var(--dim);margin-bottom:12px}
  .field .box,.fld.box{display:block;padding:0 12px}
  .field input,.field select,.field textarea,.fld input{width:100%;background:transparent;border:0;outline:0;padding:9px 0;min-height:44px;color:var(--chalk)}
  .field select{background:var(--board)}
  .field textarea{min-height:90px;resize:vertical;font:inherit}
  .field input::placeholder,.fld input::placeholder{color:var(--dim)}
  .formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}
  .check{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer}
  .check input{width:20px;height:20px;accent-color:var(--chalk)}
  .sumrow{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px;color:var(--dim)}
  .sumrow b{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:1.6rem;color:var(--chalk);margin-left:6px}

  /* modal */
  .overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:grid;place-items:center;padding:16px}
  .dialog{background:var(--board);width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;animation:rise .2s ease-out}
  @keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .dialog h2{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:2rem;line-height:1;margin-bottom:12px}
  .methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .due{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px dashed var(--faint);padding-bottom:8px;margin-bottom:12px}
  .due b,.recv b{font-family:'Caveat Brush','Patrick Hand',cursive;font-weight:400;font-size:2rem}
  .recv{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .quick .btn{min-height:38px;padding:2px 14px}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .keys .btn{min-height:48px;font-size:1.3rem}
  .change{display:flex;justify-content:space-between;margin-bottom:14px;font-size:1.25rem}
  .actions{display:flex;gap:10px;flex-wrap:wrap}
  .actions .btn{flex:1}
  .actions .btn.fill{flex:2}
  .center{text-align:center}
  .qrbox{padding:10px}
  .hint{color:var(--dim);margin-bottom:14px}
  .editpic{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;margin-bottom:14px}
  .editpic .photo{margin:0}
  .picbtns{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
  .picbtns .hint{margin:0;font-size:.9rem}
  label.btn{display:inline-flex;align-items:center;justify-content:center}
  .slip .store{font-family:'Caveat Brush','Patrick Hand',cursive;font-size:1.8rem;text-align:center;line-height:1}
  .slip .small{color:var(--dim);text-align:center;font-size:.95rem}
  .slip hr{border:0;border-top:2px dashed var(--faint);margin:10px 0}
  .slip .l{display:flex;justify-content:space-between;gap:12px}
  .slip .l.sub{color:var(--dim)}
  .slip .l.big{font-family:'Caveat Brush','Patrick Hand',cursive;font-size:1.7rem;line-height:1.2}
  .slip .thanks{text-align:center;margin:12px 0 16px}

(function(){

/* ================= util ================= */

function rp(n){return 'Rp '+num(n)}
function pad(n){return ('00'+n).slice(-3)}
function two(n){return ('0'+n).slice(-2)}
function clean(s){return String(s==null?'':s).replace(/[<>&"'`]/g,'').trim()}
function ic(n,c){return '<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#'+n+'"/></svg>'}

function shortRp(v){return v>=1e6?'Rp '+(v/1e6).toFixed(1).replace('.',',')+' jt':v>=1e3?'Rp '+Math.round(v/1e3)+' rb':'Rp '+v}
function dayStart(off){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()-off).getTime()}
function hm(iso){var d=new Date(iso);return two(d.getHours())+'.'+two(d.getMinutes())}
function dm(iso){var d=new Date(iso);return two(d.getDate())+'/'+two(d.getMonth()+1)}
function ago(iso){var m=Math.floor((Date.now()-new Date(iso))/60000);if(m<1)return 'baru saja';if(m<60)return m+' menit lalu';var h=Math.floor(m/60);return h<24?h+' jam lalu':Math.floor(h/24)+' hari lalu'}

  var r=rng(20261012),out=[],id=1,now=Date.now(),nowMin=Math.floor((now-dayStart(0))/60000),meth=['tunai','qris','kartu'],d,i;

/* ================= qr ================= */
function qrSvg(text,cls){
  var N=0,dark=null,r,c,d='';
  try{if(typeof qrcode==='function'){var q=qrcode(0,'M');q.addData(text);q.make();N=q.getModuleCount();dark=function(a,b){return q.isDark(a,b)}}}catch(e){N=0}
  if(!N){
    N=25;var s=0,i;for(i=0;i<text.length;i++)s=(s*31+text.charCodeAt(i))>>>0;
    var g=[];for(r=0;r<N;r++){g[r]=[];for(c=0;c<N;c++){s=(s*1664525+1013904223)>>>0;g[r][c]=(s/4294967296)>.52}}
    [[0,0],[0,N-7],[N-7,0]].forEach(function(f){var a,b;for(a=0;a<7;a++)for(b=0;b<7;b++){g[f[0]+a][f[1]+b]=(a===0||b===0||a===6||b===6||(a>=2&&a<=4&&b>=2&&b<=4))}});
    dark=function(a,b){return g[a][b]};
  }
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(dark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
  return '<svg class="qr '+(cls||'')+'" viewBox="-2 -2 '+(N+4)+' '+(N+4)+'" shape-rendering="crispEdges" fill="currentColor" role="img" aria-label="Kode QR"><path d="'+d+'"/></svg>';
}

function chart(data){
  var W=560,H=232,bl=192,mh=140,max=1,h='',step;
  data.forEach(function(d){if(d.v>max)max=d.v});
  step=W/data.length;
  var bw=Math.min(48,step-22);
  data.forEach(function(d,i){
    var bh=Math.round(d.v/max*mh),x=Math.round(i*step+(step-bw)/2),y=bl-bh,today=i===data.length-1;
    h+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(bh,2)+'" fill="'+(today?'currentColor':'url(#hatch)')+'" stroke="currentColor" stroke-width="2.5" filter="url(#rough)"/>'+
      '<text x="'+(x+bw/2)+'" y="'+(y-8)+'" text-anchor="middle">'+shortRp(d.v)+'</text><text class="dim" x="'+(x+bw/2)+'" y="'+(bl+26)+'" text-anchor="middle">'+d.l+'</text>';
  });
  h+='<path d="M4 '+bl+'H'+(W-4)+'" stroke="currentColor" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik penjualan 7 hari terakhir">'+h+'</svg>';
}
function adminOverview(){

function custStatus(c,base,q){
  var list=myOrders(c.no);
  var body=list.length?list.map(function(o){
    var idx={baru:-1,diterima:0,diproses:1,siap:2,selesai:4,ditolak:-2}[o.status];
    var steps=['Diterima','Dibuat','Siap diantar','Selesai'].map(function(l,i){
      var cls=i<idx?'done':i===idx?'cur':'';
      return '<li class="'+cls+'"><span class="dot">'+(cls==='done'?ic('i-cek'):'')+'</span><span class="t">'+l+'</span></li>';
    }).join('');
    var extra='';
    if(o.status==='ditolak')extra='<p class="why">Pesanan ditolak. Alasan: '+(o.rejectReason||'-')+'</p>';
    else{
      extra=(o.status==='baru'?'<p class="wait">Menunggu kasir menerima pesanan.</p>':'')+'<div class="track" aria-label="Tahap pesanan">'+steps+'</div>';
      if(o.payment.status!=='lunas'){
        extra+=o.payment.method==='qris'?'<div class="center"><div class="qrbox box r3" style="width:190px;margin:6px auto">'+qrSvg('QRIS-DEMO-'+o.number+'-'+o.total)+'</div><p class="hint">Pindai dengan aplikasi pembayaran. Menunggu verifikasi kasir.</p></div>':'<p class="hint">Silakan bayar di kasir.</p>';
      }else extra+='<p class="hint">Pembayaran lunas.</p>';
    }
    return '<section class="ostat box r2"><header><b>Pesanan #'+pad(o.number)+'</b><span class="dim">'+ago(o.createdAt)+'</span></header>'+extra+'<ul class="oitems">'+o.lines.map(function(l){return '<li><span>'+l.qty+' x '+l.name+(l.note?'<span class="note">Catatan: '+l.note+'</span>':'')+'</span><span>'+rp(l.price*l.qty)+'</span></li>'}).join('')+'</ul><div class="row"><span>Total</span><span>'+rp(o.total)+'</span></div></section>';
  }).join(''):'<div class="empty">'+ic('i-bel')+'Belum ada pesanan dari meja ini.</div>';
  return '<div class="clist" id="mlist">'+body+'</div><footer class="cbar"><span class="dim">Meja '+c.no+'</span><button type="button" class="btn fill box" data-a="go" data-v="'+base+q+'">Tambah pesanan</button></footer>';
}

  var body='';

  }
  return '<h2>Pembayaran</h2><div class="methods">'+tabs+'</div><div class="due"><span>Total tagihan</span><b>'+rp(tot)+'</b></div>'+body;
}

var KEEP=['grid','items','content','mlist','sheetBody','sscroll','ticket'];
function render(){
  var r=route(),p=r.parts,rl=role(),view='';
  if(!p.length||p[0]==='login')view=viewLogin();
  else if(p[0]==='m')view=viewCustomer();
  else if(p[0]==='kasir'){if(!rl){go('#/login');return}view=viewKasir(p[1]||'')}
  else if(p[0]==='admin'){if(rl!=='admin'){go('#/login');return}view=viewAdmin(p[1]||'')}
  else{go('#/login');return}
  var ae=document.activeElement,aid=ae&&ae.id,sel=null,sc={};
  try{if(ae&&typeof ae.selectionStart==='number')sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  KEEP.forEach(function(id){var e=$(id);if(e)sc[id]=e.scrollTop});
  $('root').innerHTML=view+modalHtml();
  KEEP.forEach(function(id){var e=$(id);if(e&&sc[id])e.scrollTop=sc[id]});
  if(aid&&$(aid)){$(aid).focus();try{if(sel)$(aid).setSelectionRange(sel[0],sel[1])}catch(e){}}
  U.pop=0;U.badgePop=false;
}

function handlePhoto(file){
  if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      U.form.img=c.toDataURL('image/jpeg',0.8);render();
    };
    im.onerror=function(){toast('File itu tidak bisa dibaca sebagai gambar')};
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(U.modal){if(!U.locked)closeModal()}
  else if(U.sheet){U.sheet=false;render()}
  else if(U.side||U.order){U.side=false;U.order=false;render()}
});
window.addEventListener('hashchange',function(){U.sheet=false;U.side=false;U.order=false;U.modal=null;U.locked=false;render()});

/* sinkronisasi antar tab. Untuk produksi, ganti dengan API + WebSocket/SSE. */
function onRemote(){
  var fresh=readStorage();if(!fresh)return;
  var before=newCount();ST=fresh;
  var after=newCount();
  if(after>before&&role()){
    var last=ST.orders.filter(function(o){return o.status==='baru'&&o.source==='qr'}).sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt)})[0];
    toast('Pesanan baru dari Meja '+(last?last.tableNo:'?'));U.badgePop=true;
  }
  render();
}
if(bc)bc.onmessage=onRemote;
window.addEventListener('storage',function(e){if(e.key===KEY)onRemote()});
setInterval(function(){var ae=document.activeElement;if(U.modal||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))return;render()},60000);

/* ================= mulai ================= */
ST=readStorage()||defaults();
try{var th=localStorage.getItem('wk-theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th)}catch(e){}
try{var ph=localStorage.getItem('wk-photo');if(ph==='color'||ph==='bw')document.documentElement.setAttribute('data-photo',ph)}catch(e){}
save();
render();
})();
</script>
