name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pos_hybrid
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_hybrid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pos_app:CHANGE_THIS_PASSWORD@localhost:5432/pos_hybrid
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pos_hybrid
      JWT_ACCESS_SECRET: ci-access-secret-key-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-key-at-least-32-chars-long
      NODE_ENV: test
      ALLOW_DEV_LOGIN: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Seed development data
        run: npm run seed-dev

      - name: Run tests
        run: npm test